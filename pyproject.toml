[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pydevices-pygraphics"
dynamic = ["version"]
description = "Native graphics cmod for CPython (FrameBuffer, Area); import as pygraphics"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
urls = { Homepage = "https://github.com/PyDevices/pygraphics", Issues = "https://github.com/PyDevices/pygraphics/issues" }

[tool.setuptools]
packages = []

[tool.setuptools.dynamic]
version = { file = "VERSION" }

# Wheel CI: one wheel per CPython minor (cp310…cp314) × Linux + Windows + Android,
# plus a separate Pyodide pyemscripten_2026_0 wasm32 wheel (see publish-release-packages.yml).
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*musllinux* *-macosx_* *-win32"
test-command = "python -c \"import pygraphics; from pygraphics import FrameBuffer, RGB565, framebuf_backend; assert framebuf_backend() == 'native'\""

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.windows]
archs = ["AMD64"]

# cibuildwheel 4.x Android archs are only arm64_v8a and x86_64 (no armeabi_v7a).
# Phones/TVs: arm64_v8a. Emulators: x86_64. API 21 tags remain installable when
# the app minSdk is higher (e.g. p4a android.minapi = 24).
[tool.cibuildwheel.android]
archs = ["arm64_v8a", "x86_64"]
environment = { ANDROID_API_LEVEL = "21" }
test-command = "python -c \"import pygraphics; assert pygraphics.framebuf_backend() == 'native'\""
test-skip = "*"

[[tool.cibuildwheel.overrides]]
select = "*-android_*"
build-frontend = "build"

[tool.ruff]
# Matches the curated selection used by the sibling library repos (palettes,
# pdwidgets). Without a config, pygraphics ran ruff's defaults, which include
# preview rules the org does not enforce -- one reason lint drifted here while
# the siblings stayed clean.
lint.select = ["E", "F", "I", "W", "B", "SIM", "PLC0415"]
lint.ignore = ["E501", "F401", "F403", "F405", "ISC003", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
# E402: every test imports `_env` first, which puts lib/ on sys.path; the
#       pygraphics imports must therefore come after it, not at the top.
# B904: the parity harness re-raises inside except by design.
"tests/**" = ["F401", "E402", "B904"]
